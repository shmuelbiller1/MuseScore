name: 'Check: Offline Choir Studio'

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node_tests:
    name: Browser-sidecar Node tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline choir renderer, UI-event and project tests
        shell: bash
        run: node --test share/choir-studio/tests/*.test.cjs
