name: 'Check: Unit Tests (utest)'

on:
  pull_request:
  workflow_dispatch:
    inputs:
      code_coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: false
      publish_coverage_report:
        description: 'Publish code coverage report and badge to musescore/mss_code_coverage (main repository only)'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      code_coverage:
        description: 'Enable code coverage'
        required: false
        type: boolean
        default: false
      publish_coverage_report:
        description: 'Publish code coverage report and badge to musescore/mss_code_coverage (main repository only)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 4" # Every Thursday night at 03:00 for master branch

concurrency:
  # If run via workflow_call, ${{ github.workflow }} is the root workflow's name (e.g. 'Build: All'),
  # which is the same for all workflows called in that run, hence we must add a unique suffix here.
  group: ${{ github.workflow }} ${{ github.event_name }} ${{ github.ref }} utest
  cancel-in-progress: true

jobs:
  run_tests:
    runs-on: ubuntu-24.04
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: "Configure workflow"
      run: |
        bash ./buildscripts/ci/tools/make_build_number.sh
        BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)

        echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV

    - parallel:
      - name: Restore ccache files
        id: restore-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{runner.os}}-${{runner.arch}}-utests-ccache-
          restore-keys: |
            ${{runner.os}}-${{runner.arch}}-utests-ccache-
      - name: Setup ccache
        run: |
          sudo apt-get install -y ccache
          bash ./muse/buildscripts/ci/tools/setup_ccache_config.sh

    - name: Free up disk space
      background: true
      run: |
        sudo docker system prune -a -f
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc /usr/local/.ghcup
        sudo rm -rf /usr/share/swift
        sudo rm -rf /opt/hostedtoolcache/CodeQL

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.11.2
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qt5compat qtnetworkauth qtshadertools qtwebsockets'
        cache: true
    - name: Setup environment
      run: |
        bash ./buildscripts/ci/linux/setup.sh

    - name: Build
      id: build
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        CODE_COVERAGE: ${{ inputs.code_coverage }}
      run: |
        set -o pipefail
        mkdir -p build.artifacts/env

        ENABLE_CODE_COVERAGE='false'

        if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$CODE_COVERAGE" == true ]]; then
          ENABLE_CODE_COVERAGE='true'
        else
          ENABLE_CODE_COVERAGE='false'
        fi

        bash ./buildscripts/ci/linux/build_utest.sh -n ${{ env.BUILD_NUMBER }} --enable_code_coverage ${ENABLE_CODE_COVERAGE} 2>&1 | tee "$RUNNER_TEMP/utest-build.log"

    # Logs on the runner are hosted on a separate storage domain that is not
    # always accessible from the fork. Expose compiler diagnostics in check
    # annotations while preserving the original build exit status above.
    - name: Report build failures
      if: failure() && steps.build.outcome == 'failure'
      run: |
        python3 - <<'PY'
        import os
        from pathlib import Path

        log = Path(os.environ['RUNNER_TEMP']) / 'utest-build.log'
        if not log.exists():
            print('::error title=Unit test build failed::No build log was produced')
        else:
            lines = log.read_text(errors='replace').splitlines()
            matches = [line for line in lines if any(token in line for token in
                       ('error:', 'fatal error:', 'FAILED:', 'CMake Error', 'undefined reference'))]
            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                summary.write('### Unit test build diagnostics\n```text\n')
                summary.write('\n'.join(matches[:60] or lines[-30:]))
                summary.write('\n```\n')
            for line in (matches[:10] or lines[-5:]):
                message = line.strip()[:900].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                print(f'::error title=Unit test build failed::{message}')
        PY

    - name: Show ccache stats
      run: |
        ccache -sv
    - name: Run tests
      run: |
        bash ./buildscripts/ci/linux/runutests.sh
      env:
        ASAN_OPTIONS: "detect_leaks=0"

    # Preserve failed suite names and assertions as check annotations even if
    # GitHub's compressed runner logs cannot be downloaded by this fork.
    - name: Report failing tests
      if: failure()
      run: python3 tools/historical_performance/report_ci_test_failures.py build.debug

    - name: Isolate MIDI test abort
      if: failure()
      run: |
        if grep -q ':iex_midi_tests$' build.debug/Testing/Temporary/LastTestsFailed.log; then
          cd build.debug
          export QT_QPA_PLATFORM=minimal:enable_fonts
          export ASAN_OPTIONS=detect_leaks=0:new_delete_type_mismatch=0
          export GTEST_FILTER=MidiExportTests.HistoricalTempo_18Parts_RelativeRampAndPlaybackMultiplier
          set +e
          ctest -V -R '^iex_midi_tests$' > midi-repro.log 2>&1
          status=$?
          set -e
          echo '## Isolated historical MIDI export test' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 midi-repro.log >> "$GITHUB_STEP_SUMMARY"
          detail=$(tail -c 900 midi-repro.log | tr '\r\n' '  ' | cut -c1-800)
          echo "::notice title=Isolated MIDI test exit ${status}::${detail}"
        fi

    - name: Code coverage
      if: github.event_name == 'schedule' || inputs.code_coverage
      run: |
        # Writes filtered_coverage.info, coverage_badge.svg, coverage_report/ and exports COVERAGE, FUNCTIONS_COVERAGE
        cmake -P ./muse/buildscripts/ci/codecoverage/make_code_coverage.cmake --build_dir build.debug

    - name: Upload coverage report
      if: github.event_name == 'schedule' || inputs.code_coverage
      uses: actions/upload-artifact@v7
      with:
        name: code_coverage_report
        path: |
          filtered_coverage.info
          coverage_badge.svg
          coverage_report/

    - name: Publish coverage report
      if: github.repository == 'musescore/MuseScore' && ( github.event_name == 'schedule' || ( inputs.code_coverage && inputs.publish_coverage_report ) )
      env:
        DEPLOY_KEY: ${{ secrets.CODE_COVERAGE_DEPLOY_KEY }}
      run: |
        KEY_FILE="${RUNNER_TEMP}/code_coverage_deploy_key"
        echo "${DEPLOY_KEY}" > "${KEY_FILE}"
        chmod 600 "${KEY_FILE}"
        export GIT_SSH_COMMAND="ssh -i ${KEY_FILE} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

        cmake -P ./muse/buildscripts/ci/codecoverage/publish_code_coverage.cmake \
          --repo_url git@github.com:musescore/mss_code_coverage.git \
          --branch main \
          --report_dir coverage_report \
          --badge coverage_badge.svg \
          --lines "${COVERAGE}" \
          --functions "${FUNCTIONS_COVERAGE}"

        rm -f "${KEY_FILE}"

        echo "Report: https://musescore.github.io/mss_code_coverage/" | tee -a $GITHUB_STEP_SUMMARY

    - name: Prepare ccache files for saving
      id: prepare-save-ccache
      if: always() && github.event_name != 'pull_request'
      run: |
        ccache --recompress 10
        echo "CCACHE_TIMESTAMP=$(date -u +"%F-%T")" | tee -a $GITHUB_OUTPUT

    - name: Save ccache files
      if: always() && github.event_name != 'pull_request'
      uses: actions/cache/save@v6
      with:
        key: ${{ steps.restore-ccache.outputs.cache-primary-key }}${{ steps.prepare-save-ccache.outputs.CCACHE_TIMESTAMP }}
        path: ${{ github.workspace }}/.ccache
